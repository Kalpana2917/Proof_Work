<!DOCTYPE html>
<html>
<head>
<style>
  @media print { button { display: none; } }
  .certificate {
    border: 15px double #1a73e8;
    padding: 50px;
    text-align: center;
    width: 750px;
    margin: 50px auto;
    font-family: 'Georgia';
  }
  h1 { color: #1a73e8; }
</style>
</head>
<body>
  <div class="certificate" id="cert">
    <h1>🏆 ProofWork</h1>
    <h2>Certificate of Completion</h2>
    <p>This is to certify that</p>
    <h2 id="fname">Aman Sharma</h2>
    <p>has successfully completed</p>
    <h3 id="pname">Project ID: 1 - Online Grocery Marketplace</h3>
    <br><br>
    <p><strong>Certificate Code:</strong> <span id="code">PW-CERT-2026-0001</span></p>
    <p>Verify at: https://proofwork.io/cert/<span id="code2">PW-CERT-2026-0001</span></p>
    <p>Date: <span id="date"></span></p>
  </div>
  <center>
    <button onclick="window.print()" style="padding:15px 30px; font-size:18px; background:#1a73e8; color:white; border:none; border-radius:5px; cursor:pointer;">🖨️ Print / Save PDF</button>
  </center>

<script>
  document.getElementById('date').innerText = new Date().toLocaleDateString();
  const params = new URLSearchParams(window.location.search);
  if(params.get('user')) document.getElementById('fname').innerText = params.get('user');
  if(params.get('project')) document.getElementById('pname').innerText = params.get('project');
  if(params.get('code')) {
    document.getElementById('code').innerText = params.get('code');
    document.getElementById('code2').innerText = params.get('code');
  }
</script>
</body>
</html>
